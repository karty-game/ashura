name: Build, test and publish samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build native, WASM and sample gallery
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: '2'
      GOWORK: 'off'
      CGO_ENABLED: '0'
      GOFLAGS: '-tags=nofakecgo'
      ASHURA_TEST_HOST: 'linux/amd64'
      KARTY_LIGHTMAP_SOFTWARE_FOR_CI: '1'
      WGPU_BACKEND: 'vulkan'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@v3
      - name: Verify browser compiler prerequisites (export tests must not skip)
        run: |
          mise exec -- tinygo version
          mise exec -- wasm-opt --version
      - name: Cache Go modules and compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Check formatting and native/browser source lint
        run: mise run check-source
      - name: Install software Vulkan for explicit functional asset builds
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers
      - name: Select the native CPU Vulkan adapter
        shell: bash
        run: |
          shopt -s nullglob
          asset_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#asset_icds[@]}" -eq 1
          echo "VK_ICD_FILENAMES=${asset_icds[0]}" >> "$GITHUB_ENV"
      - name: Cache mise asset tool downloads and installations
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mise
            ~/.local/share/mise/installs
          key: ${{ runner.os }}-${{ runner.arch }}-mise-asset-tools-${{ hashFiles('mise.toml', 'pkg/assetbuild/managed_tool*.go', 'pkg/assetbuild/tool_releases/*.json', 'pkg/assetbuild/materialize_tools.go') }}
      - name: Restore prepared asset action cache
        id: sample-assets
        uses: actions/cache/restore@v4
        with:
          # Exclude generated outputs, publication journals and project locks.
          path: samples/*/generated/cache/assets/v1
          key: ${{ runner.os }}-${{ runner.arch }}-sample-assets-v1-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}-${{ hashFiles('pkg/**', 'internal/**', 'samples/**/asset.config.go', 'samples/**/assets/**', 'samples/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sample-assets-v1-${{ hashFiles('mise.toml', 'go.mod', 'go.sum') }}-
      - name: Prepare sample assets
        run: mise run assets
      - name: Save prepared asset action cache before validation
        if: steps.sample-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: samples/*/generated/cache/assets/v1
          # Use the restore key captured before generated files existed.
          key: ${{ steps.sample-assets.outputs.cache-primary-key }}
      - name: Lint prepared samples, then run tests and builds in parallel
        # go test ./... includes the TinyGo and mixed-runtime export regressions.
        run: mise run check-prepared
      - name: Export sample gallery
        # The export enforces every sample's complete-file budget, including Impostors.
        run: mise run build-samples
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/samples

  deploy:
    name: Publish sample gallery
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy sample gallery
        id: deployment
        uses: actions/deploy-pages@v4
